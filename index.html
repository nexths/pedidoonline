
<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#ffffff">
<title>Amora | Cardápio Digital</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://unpkg.com/lucide@latest"></script>

<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Playfair+Display:wght@500;600;700&display=swap" rel="stylesheet">

<style>

:root {
    --green: #536749;
    --green-dark: #35472e;
    --green-light: #eef2e9;
    --text: #252823;
    --muted: #91948c;
    --line: #eeefeb;
    --white: #ffffff;
}

* {
    box-sizing: border-box;
    -webkit-tap-highlight-color: transparent;
}

body {
    margin: 0;
    background: #fff;
    color: var(--text);
    font-family: 'DM Sans', sans-serif;
    padding-bottom: 170px;
}

button, input {
    font: inherit;
}

button {
    cursor: pointer;
    border: 0;
}

button:disabled {
    opacity: .4;
    cursor: not-allowed;
}

button, input {
    outline-offset: 4px;
}

button {
    transition: background .2s, transform .2s;
}

button:active {
    transform: scale(.96);
}

svg {
    width: 20px;
    height: 20px;
    stroke-width: 1.7;
    flex-shrink: 0;
}

.container {
    width: 100%;
    max-width: 760px;
    margin: auto;
    padding: 0 24px;
}

/* CABEÇALHO */

header {
    background: #fff;
    border-bottom: 1px solid var(--line);
}

.header-content {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding-top: 24px;
    padding-bottom: 22px;
}

.logo {
    font-family: 'Playfair Display', serif;
    font-size: 40px;
    font-weight: 700;
    line-height: .95;
    letter-spacing: -2px;
    color: var(--green-dark);
}

.logo span {
    color: #98aa87;
}

.logo-subtitle {
    font-size: 9px;
    letter-spacing: 3.5px;
    margin-top: 10px;
    color: #818878;
}

.table-badge {
    display: flex;
    align-items: center;
    gap: 8px;
    background: var(--green-light);
    color: var(--green);
    padding: 10px 14px;
    border-radius: 30px;
    font-size: 12px;
    font-weight: 700;
}

.table-badge svg {
    width: 15px;
    height: 15px;
}

/* APRESENTAÇÃO */

.welcome {
    padding-top: 29px;
}

.eyebrow {
    color: var(--green);
    letter-spacing: 2px;
    font-size: 10px;
    font-weight: 700;
    text-transform: uppercase;
}

.welcome h1 {
    font-family: 'Playfair Display', serif;
    font-weight: 600;
    font-size: clamp(28px, 6.5vw, 37px);
    line-height: 1.2;
    letter-spacing: -.8px;
    margin: 8px 0;
}

.welcome p {
    font-size: 13px;
    color: #8c9086;
    margin: 10px 0 22px;
}

/* PESQUISA */

.search {
    display: flex;
    align-items: center;
    gap: 12px;
    background: #f5f6f3;
    padding: 14px 17px;
    border-radius: 13px;
}

.search svg {
    color: #949d8b;
}

.search input {
    border: 0;
    background: transparent;
    outline: none;
    min-width: 0;
    width: 100%;
    font-size: 14px;
    color: var(--text);
}

.search input::placeholder {
    color: #a1a59a;
}

/* CATEGORIAS */

.category-bar {
    position: sticky;
    top: 0;
    z-index: 10;
    background: #fffffffa;
    backdrop-filter: blur(16px);
    border-bottom: 1px solid var(--line);
    margin-top: 16px;
}

.categories {
    display: flex;
    gap: 9px;
    overflow-x: auto;
    scrollbar-width: none;
    padding-top: 13px;
    padding-bottom: 17px;
}

.categories::-webkit-scrollbar {
    display: none;
}

.category {
    flex-shrink: 0;
    background: #f5f6f3;
    color: #777e70;
    padding: 10px 17px;
    border-radius: 30px;
    font-size: 12px;
    font-weight: 600;
    white-space: nowrap;
}

.category.active {
    background: var(--green);
    color: white;
}

/* PRODUTOS */

.section-heading {
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    gap: 10px;
    margin: 26px 0 6px;
}

.section-heading h2 {
    font-family: 'Playfair Display', serif;
    font-weight: 600;
    font-size: 25px;
    margin: 0;
}

.section-heading span {
    font-size: 11px;
    color: var(--muted);
}

.product {
    display: flex;
    align-items: center;
    gap: 16px;
    padding: 21px 0;
    border-bottom: 1px solid var(--line);
}

.product-image {
    width: 108px;
    height: 108px;
    border-radius: 15px;
    object-fit: cover;
    background: #f1f2ee;
    flex-shrink: 0;
}

.product-info {
    flex: 1;
    min-width: 0;
}

.product-info h3 {
    font-size: 15px;
    line-height: 1.3;
    font-weight: 700;
    margin: 0 0 6px;
}

.product-info p {
    font-size: 12px;
    color: #96998f;
    line-height: 1.5;
    margin: 0;
}

.product-bottom {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 5px;
    margin-top: 13px;
}

.price {
    font-size: 15px;
    color: var(--green);
    font-weight: 700;
    white-space: nowrap;
}

.quantity {
    display: flex;
    align-items: center;
    gap: 8px;
    flex-shrink: 0;
}

.quantity button {
    display: grid;
    place-items: center;
    width: 32px;
    height: 32px;
    border-radius: 50%;
    background: var(--green-light);
    color: var(--green);
    padding: 0;
}

.quantity button svg {
    width: 16px;
    height: 16px;
}

.quantity span {
    font-size: 13px;
    font-weight: 700;
}

.quantity[data-empty="true"] .minus,
.quantity[data-empty="true"] .count {
    display: none;
}

/* CARRINHO E NAVEGAÇÃO */

.bottom {
    position: fixed;
    bottom: 0;
    left: 0;
    right: 0;
    z-index: 20;
    background: #fffffffa;
    backdrop-filter: blur(16px);
    border-top: 1px solid var(--line);
    box-shadow: 0 -8px 40px #26312208;
    padding-bottom: env(safe-area-inset-bottom);
}

.cart-button {
    width: 100%;
    background: var(--green);
    color: #fff;
    border-radius: 15px;
    padding: 17px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin: 13px 0 0;
    min-height: 60px;
}

.cart-left {
    display: flex;
    align-items: center;
    gap: 11px;
}

.cart-label {
    text-align: left;
}

.cart-label strong {
    display: block;
    font-size: 14px;
}

.cart-label small {
    color: #dbe5d5;
    font-size: 11px;
}

.cart-total {
    font-size: 16px;
    font-weight: 700;
}

.nav {
    display: flex;
    justify-content: space-around;
    padding: 15px 0;
}

.nav button {
    background: transparent;
    color: #a2a79b;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 5px;
    font-size: 11px;
    font-weight: 600;
    min-width: 90px;
}

.nav button.active {
    color: var(--green);
}

/* PEDIDOS */

.order-card {
    border: 1px solid var(--line);
    padding: 19px;
    margin: 15px 0;
    border-radius: 16px;
}

.order-header {
    padding-bottom: 14px;
    border-bottom: 1px solid var(--line);
}

.order-header h3 {
    margin: 0;
    font-size: 15px;
}

.row {
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 12px;
}

.order-item {
    padding: 15px 0;
    border-bottom: 1px solid var(--line);
    font-size: 14px;
}

.order-total {
    margin-top: 18px;
    font-weight: 700;
    color: var(--green);
}

.status {
    display: inline-block;
    font-size: 10px;
    background: #f6eedb;
    color: #96712d;
    padding: 5px 9px;
    border-radius: 20px;
    margin-top: 5px;
}

.status.pronto,
.status.pago {
    background: #e8f0e2;
    color: #536749;
}

.status.em_preparo {
    background: #e8eef8;
    color: #4c6b94;
}

.status.cancelado {
    background: #fcece8;
    color: #ad554a;
}

.cancelled {
    color: #ad554a;
    text-decoration: line-through;
}

.cancel-btn {
    padding: 5px 0;
    background: none;
    color: #ad554a;
    font-size: 11px;
    display: block;
    margin-left: auto;
}

/* JANELA DO CARRINHO */

dialog {
    width: min(94%, 480px);
    border: 0;
    border-radius: 24px;
    padding: 25px;
    color: var(--text);
    max-height: 85dvh;
    overflow: auto;
}

dialog::backdrop {
    background: #18231780;
    backdrop-filter: blur(4px);
}

dialog h2 {
    font-family: 'Playfair Display', serif;
    margin: 0;
    font-size: 26px;
}

.icon-button {
    border-radius: 50%;
    width: 35px;
    height: 35px;
    color: var(--green);
    background: var(--green-light);
    display: grid;
    place-items: center;
}

.cart-item {
    padding: 17px 0;
    border-bottom: 1px solid var(--line);
}

.cart-item small {
    color: var(--green);
}

.customer-label {
    display: block;
    font-size: 13px;
    font-weight: 600;
    margin-top: 24px;
}

#customer {
    width: 100%;
    border: 1px solid #dfe4da;
    border-radius: 12px;
    padding: 14px;
    margin-top: 8px;
}

.checkout-total {
    margin: 24px 0;
}

.checkout-total strong:last-child {
    color: var(--green);
    font-size: 23px;
}

.send-button {
    background: var(--green);
    color: white;
    width: 100%;
    padding: 16px;
    border-radius: 13px;
    font-weight: 700;
}

#cartMessage {
    color: #8d7660;
    font-size: 12px;
    line-height: 1.5;
}

.notice {
    background: #f5f6f2;
    border-radius: 12px;
    padding: 17px;
    margin: 20px 0;
    color: #777e70;
    font-size: 13px;
}

.empty {
    padding: 35px 15px;
    text-align: center;
    color: #8b9185;
    font-size: 14px;
}

.footer-note {
    font-size: 10px;
    text-align: center;
    color: #b2b6ac;
    margin: 35px 0 0;
    letter-spacing: .6px;
}

#toast {
    position: fixed;
    top: 16px;
    left: 50%;
    transform: translateX(-50%);
    z-index: 100;
    background: var(--green-dark);
    color: white;
    padding: 13px 18px;
    border-radius: 12px;
    width: max-content;
    max-width: 90%;
    font-size: 13px;
    text-align: center;
    box-shadow: 0 6px 24px #0002;
}

[hidden] {
    display: none !important;
}

@media(max-width: 380px) {

    .container {
        padding-left: 17px;
        padding-right: 17px;
    }

    .product {
        gap: 12px;
    }

    .product-image {
        width: 88px;
        height: 95px;
    }

    .quantity {
        gap: 5px;
    }

    .quantity button {
        width: 28px;
        height: 28px;
    }
}

@media(min-width: 700px) {

    body {
        background: #f7f8f5;
    }

    header,
    .category-bar {
        max-width: 760px;
        margin-left: auto;
        margin-right: auto;
    }

    main {
        max-width: 760px;
        margin: auto;
        background: white;
        min-height: 80vh;
        padding-bottom: 30px;
    }

    .product-image {
        width: 125px;
        height: 115px;
    }

    .product-info h3 {
        font-size: 17px;
    }

    .product-info p {
        font-size: 13px;
    }

    .bottom {
        max-width: 760px;
        margin: auto;
    }
}

</style>
</head>

<body>

<header>

    <div class="container header-content">

        <div>
            <div class="logo">amora<span>.</span></div>
            <div class="logo-subtitle">BISTRÔ & CAFÉ</div>
        </div>

        <div class="table-badge">
            <i data-lucide="utensils"></i>
            <span id="mesaLabel">Mesa 01</span>
        </div>

    </div>

</header>

<main>

    <div id="menuView">

        <section class="container welcome">

            <div class="eyebrow">Feito com carinho</div>

            <h1>O que vamos<br>saborear hoje?</h1>

            <p>Escolha seu favorito e aproveite o momento.</p>

            <div class="search">

                <i data-lucide="search"></i>

                <input
                    id="search"
                    type="search"
                    placeholder="Encontre seu favorito"
                    aria-label="Pesquisar produtos"
                >

            </div>

        </section>

        <div class="category-bar">

            <nav
                class="container categories"
                id="categories"
            ></nav>

        </div>

        <section class="container">

            <div id="notice" class="notice">
                Carregando cardápio...
            </div>

            <div id="products"></div>

            <div class="footer-note">
                AMORA BISTRÔ & CAFÉ · Fotos ilustrativas
            </div>

        </section>

    </div>

    <section
        id="ordersView"
        class="container welcome"
        hidden
    >

        <div class="eyebrow">Seu atendimento</div>

        <h1>Meus pedidos</h1>

        <p>Acompanhe o preparo em tempo real.</p>

        <div id="orders"></div>

    </section>

</main>

<div class="bottom">

    <div class="container">

        <button class="cart-button" id="cartOpen" disabled>

            <div class="cart-left">

                <i data-lucide="shopping-bag"></i>

                <div class="cart-label">

                    <strong>Meu pedido</strong>

                    <small id="cartCount">0 itens</small>

                </div>

            </div>

            <span class="cart-total" id="cartTotal">
                R$ 0,00
            </span>

        </button>

        <nav class="nav">

            <button id="menuTab" class="active">

                <i data-lucide="book-open"></i>

                Cardápio

            </button>

            <button id="ordersTab">

                <i data-lucide="receipt-text"></i>

                Meus pedidos

            </button>

        </nav>

    </div>

</div>

<dialog id="cart">

    <div class="row">

        <h2>Meu pedido</h2>

        <button
            class="icon-button"
            id="closeCart"
            aria-label="Fechar carrinho"
        >
            <i data-lucide="x"></i>
        </button>

    </div>

    <div id="cartItems"></div>

    <label for="customer" class="customer-label">
        Como podemos chamar você?
    </label>

    <input
        id="customer"
        placeholder="Seu nome"
        maxlength="100"
        autocomplete="given-name"
    >

    <div class="row checkout-total">

        <strong>Total estimado</strong>

        <strong id="checkoutTotal">R$ 0,00</strong>

    </div>

    <button class="send-button" id="send">
        Enviar pedido
    </button>

    <p id="cartMessage" role="status"></p>

</dialog>

<div id="toast" role="status" hidden></div>

<script>

/* SUPABASE */

const sb = window.supabase.createClient(
    'https://lcwmwyreawzjrggnbpcz.supabase.co',
    'sb_publishable_H4H0Xa_exMThiz4ky09IYQ_BU44zcd4',
    {
        auth: {
            storageKey: 'amora-cardapio-auth'
        }
    }
);

const $ = id => document.getElementById(id);

const money = n =>
    Number(n || 0).toLocaleString('pt-BR', {
        style: 'currency',
        currency: 'BRL'
    });

const esc = value =>
    String(value ?? '').replace(/[&<>"']/g, c => ({
        '&': '&amp;',
        '<': '&lt;',
        '>': '&gt;',
        '"': '&quot;',
        "'": '&#39;'
    }[c]));

function icons() {
    window.lucide?.createIcons();
}

/* IDENTIFICAR MESA */

const raw = new URLSearchParams(
    location.search
).get('mesa') || '01';

const valid =
    /^\d{1,2}$/.test(raw) &&
    Number(raw) >= 1 &&
    Number(raw) <= 20;

const mesa = 'Mesa ' + raw.padStart(2, '0');

$('mesaLabel').textContent =
    valid ? mesa : 'Mesa inválida';

/* CATEGORIAS */

const categories = [
    ['Bebidas Quentes', 'Cafés'],
    ['Especiais Amora', 'Especiais'],
    ['Pães, Bolos e Doces', 'Doces'],
    ['Lanches', 'Lanches'],
    ['Focaccias e Salgados', 'Salgados'],
    ['Bebidas Frias', 'Bebidas']
];

/* FOTOS E DESCRIÇÕES ILUSTRATIVAS */

const catalog = {

    'Café Expresso P': [
        'photo-1510707577719-ae7c14805e3a',
        'Intenso, aromático e encorpado.'
    ],

    'Cappuccino': [
        'photo-1572442388796-11668a67e53d',
        'Cremoso com um toque especial da casa.'
    ],

    'Chocolate Quente': [
        'photo-1542990253-0d0f5be5f0ed',
        'Encorpado e reconfortante.'
    ],

    'Latte Gelado': [
        'photo-1517701604599-bb29b565090c',
        'Café expresso, leite gelado e baunilha.'
    ],

    'Mocha Gelado': [
        'photo-1461023058943-07fcbe16d735',
        'Café expresso, chocolate e leite gelado.'
    ],

    'Affogato': [
        'photo-1563805042-7684c019e1cb',
        'Sorvete de baunilha com café expresso.'
    ],

    'Pink Lemonade': [
        'photo-1513558161293-cdaf765edfd4',
        'Limão, água com gás e frutas vermelhas.'
    ],

    'Pão com Manteiga na Chapa': [
        'photo-1509440159596-0249088772ff',
        'Quentinho, dourado e crocante.'
    ],

    'Pão de Queijo Grande': [
        'photo-1558961363-fa8fdf82db35',
        'Tradicional e irresistível.'
    ],

    'Honey Toast': [
        'photo-1484723091739-30a097e8f929',
        'Uma fatia generosa com toque de mel.'
    ],

    'Bolos Recheados Especiais': [
        'photo-1578985545062-69928b1d9587',
        'Deliciosas opções artesanais do dia.'
    ],

    'Queijo Quente': [
        'photo-1528735602780-2552fd46c7af',
        'Pão tostado com queijo derretido.'
    ],

    'Bauru': [
        'photo-1553909489-cd47e0907980',
        'Presunto, queijo e tomate.'
    ],

    'Croque Monsieur': [
        'photo-1528735602780-2552fd46c7af',
        'Presunto, queijo e molho bechamel gratinado.'
    ],

    'Croque Madame': [
        'photo-1484723091739-30a097e8f929',
        'Croque monsieur finalizado com ovo frito.'
    ],

    'Sanduíche de Focaccia Parma': [
        'photo-1509722747041-616f39b57569',
        'Sanduíche preparado com focaccia.'
    ],

    'Empanada': [
        'photo-1601050690597-df0568f70950',
        'Salgado artesanal recheado.'
    ],

    'Torta de Frango': [
        'photo-1600628422019-6c2e0b48f25b',
        'Fatia de torta cremosa de frango.'
    ],

    'Refrigerante Lata': [
        'photo-1622483767028-3f66f32aef97',
        'Geladíssimo.'
    ],

    'Suco de Frutas': [
        'photo-1600271886742-f049cd451bba',
        'Natural e refrescante.'
    ],

    'Cerveja Long Neck': [
        'photo-1535958636474-b021ee887b13',
        'Servida gelada.'
    ]

};

const placeholder =
    'data:image/svg+xml;charset=UTF-8,' +
    encodeURIComponent(`
        <svg xmlns="http://www.w3.org/2000/svg"
             width="240" height="240">
            <rect width="240" height="240"
                  fill="#eef2e9"/>
            <text x="120" y="126"
                  text-anchor="middle"
                  font-size="25"
                  font-family="Georgia"
                  fill="#536749">amora.</text>
        </svg>
    `);

function photo(p) {

    if (p.imagem) {

        try {

            if (new URL(p.imagem).protocol === 'https:') {
                return p.imagem;
            }

        } catch {}
    }

    const id = catalog[p.nome]?.[0];

    return id
        ? 'https://images.unsplash.com/' + id +
          '?w=320&h=320&fit=crop&auto=format&q=85'
        : placeholder;
}

/* ESTADO */

let products = [];
let orders = [];
let basket = new Map();

let activeCategory = 'Todos';
let uid = null;
let ready = false;
let busy = false;
let seq = 0;
let toastTimer;

/* NOTIFICAÇÕES */

function toast(message) {

    $('toast').textContent = message;
    $('toast').hidden = false;

    clearTimeout(toastTimer);

    toastTimer = setTimeout(() => {
        $('toast').hidden = true;
    }, 3200);
}

function notice(message) {

    $('notice').textContent = message;
    $('notice').hidden = !message;
}

/* NORMALIZAR PESQUISA */

function normalize(text) {

    return String(text || '')
        .normalize('NFD')
        .replace(/[\u0300-\u036f]/g, '')
        .toLowerCase();
}

/* CATEGORIAS INTERATIVAS */

function renderCategories() {

    const known = categories.filter(([name]) =>
        products.some(p => p.categoria === name)
    );

    const extras = [...new Set(
        products.map(p => p.categoria)
    )].filter(name =>
        !categories.some(c => c[0] === name)
    ).map(name => [name, name]);

    const list = [
        ['Todos', 'Todos'],
        ...known,
        ...extras
    ];

    $('categories').innerHTML = list.map(
        ([name, label]) => `

            <button
                class="category ${
                    activeCategory === name ? 'active' : ''
                }"
                data-category="${esc(name)}"
            >
                ${esc(label)}
            </button>

        `
    ).join('');
}

/* CONTROLE DE QUANTIDADES */

function quantityHTML(id) {

    const n = basket.get(String(id)) || 0;

    return `

        <div class="quantity" data-empty="${n === 0}">

            <button
                class="minus"
                data-id="${esc(id)}"
                data-delta="-1"
                aria-label="Remover produto"
            >
                <i data-lucide="minus"></i>
            </button>

            <span
                class="count"
                data-count="${esc(id)}"
            >${n}</span>

            <button
                data-id="${esc(id)}"
                data-delta="1"
                aria-label="Adicionar produto"
            >
                <i data-lucide="plus"></i>
            </button>

        </div>

    `;
}

function count() {

    return [...basket.values()]
        .reduce((a, b) => a + b, 0);
}

function total() {

    return products.reduce(
        (sum, p) =>
            sum +
            Number(p.preco) *
            (basket.get(String(p.id)) || 0),
        0
    );
}

function changeQty(id, delta) {

    if (busy || !ready) return;

    if (delta > 0 && count() >= 50) {

        toast('Limite de 50 itens por pedido.');
        return;
    }

    const n = (basket.get(id) || 0) + delta;

    if (n <= 0) {
        basket.delete(id);
    } else {
        basket.set(id, n);
    }

    document.querySelectorAll(
        '[data-count="' + id + '"]'
    ).forEach(el => {

        el.textContent = basket.get(id) || 0;

        el.parentElement.dataset.empty =
            String(!basket.get(id));
    });

    renderCart();
}

/* EXIBIR PRODUTOS */

function renderProducts() {

    const search = normalize($('search').value);

    const list = products.filter(p => {

        const description =
            p.descricao || catalog[p.nome]?.[1] || '';

        const matchesSearch = normalize(
            p.nome + ' ' + description + ' ' + p.categoria
        ).includes(search);

        return matchesSearch && (
            activeCategory === 'Todos' ||
            p.categoria === activeCategory
        );
    });

    const groups = [...new Set([
        ...categories.map(c => c[0]),
        ...list.map(p => p.categoria)
    ])];

    $('products').innerHTML = groups.map(category => {

        const group = list.filter(
            p => p.categoria === category
        );

        if (!group.length) return '';

        return `

            <div class="section-heading">

                <h2>${esc(category)}</h2>

                <span>${group.length} opções</span>

            </div>

            ${group.map(p => `

                <article class="product">

                    <img
                        class="product-image"
                        src="${esc(photo(p))}"
                        alt="${esc(p.nome)}"
                        loading="lazy"
                    >

                    <div class="product-info">

                        <h3>${esc(p.nome)}</h3>

                        <p>${esc(
                            p.descricao ||
                            catalog[p.nome]?.[1] || ''
                        )}</p>

                        <div class="product-bottom">

                            <span class="price">
                                ${money(p.preco)}
                            </span>

                            ${quantityHTML(p.id)}

                        </div>

                    </div>

                </article>

            `).join('')}

        `;

    }).join('') ||

    '<div class="empty">Nenhum produto encontrado.</div>';

    icons();
}

document.addEventListener('error', e => {

    if (
        e.target.classList?.contains('product-image') &&
        e.target.src !== placeholder
    ) {
        e.target.src = placeholder;
    }

}, true);

/* PESQUISA */

$('search').addEventListener('input', () => {

    activeCategory = 'Todos';

    renderCategories();
    renderProducts();
});

/* CARRINHO */

function renderCart() {

    $('cartCount').textContent =
        count() + (count() === 1 ? ' item' : ' itens');

    $('cartTotal').textContent = money(total());

    $('checkoutTotal').textContent = money(total());

    $('cartOpen').disabled = !ready;

    $('send').disabled = busy || !ready || !count();

    $('cartItems').innerHTML = products.filter(
        p => basket.has(String(p.id))
    ).map(p => `

        <div class="row cart-item">

            <div>

                <strong>${esc(p.nome)}</strong>

                <br>

                <small>${money(p.preco)}</small>

            </div>

            ${quantityHTML(p.id)}

        </div>

    `).join('') ||

    '<div class="empty">Seu carrinho está vazio.</div>';

    icons();
}

$('cartOpen').onclick = () => {

    $('cartMessage').textContent = '';

    $('cart').showModal();
};

$('closeCart').onclick = () => {

    if (!busy) $('cart').close();
};

$('cart').addEventListener('cancel', e => {

    if (busy) e.preventDefault();
});

/* ENVIAR PEDIDO */

$('send').onclick = async () => {

    if (busy || !ready || !count()) return;

    const name = $('customer').value.trim();

    if (!name) {

        $('cartMessage').textContent =
            'Informe seu nome para continuar.';

        $('customer').focus();
        return;
    }

    busy = true;

    renderCart();

    $('cartMessage').textContent =
        'Enviando seu pedido...';

    try {

        const ids = [...basket].flatMap(
            ([id, n]) => Array(n).fill(Number(id))
        );

        const { data, error } = await sb.rpc(
            'criar_pedido',
            {
                p_mesa: mesa,
                p_cliente: name,
                p_produtos: ids
            }
        );

        if (error) throw error;

        basket.clear();

        renderProducts();

        $('cart').close();

        toast('Pedido enviado com sucesso!');

        showTab('menu');

    } catch (e) {

        $('cartMessage').textContent =
            'Não foi possível confirmar o envio. ' +
            e.message +
            '. Confira Meus pedidos antes de tentar novamente.';

    } finally {

        busy = false;

        renderCart();
    }
};

/* STATUS DOS PEDIDOS */

const labels = {
    pendente: 'Aguardando preparo',
    em_preparo: 'Em preparo',
    pronto: 'Pronto',
    cancelado: 'Cancelado'
};

let itensPagosCliente = new Set();

function renderOrders() {

    // Exibe somente pedidos com itens ainda em atendimento.
    // Pagamentos não encerram o preparo; pedidos pagos e prontos saem da tela.
    const pedidosVisiveis = orders.filter(o =>
        (Array.isArray(o.itens) ? o.itens : []).some(i =>
            i.status !== 'cancelado' && (
                !itensPagosCliente.has(i.id) ||
                !['pronto', 'cancelado'].includes(i.status)
            )
        )
    );

    $('orders').innerHTML = pedidosVisiveis.map(o => {

        const payment =
            o.status_pagamento === 'pago'
            ? 'Pago'
            : o.status_pagamento === 'cancelado'
            ? 'Cancelado'
            : 'Em aberto';

        return `

            <article class="order-card">

                <div class="row order-header">

                    <div>

                        <h3>Pedido #${esc(o.id)}</h3>

                        <span style="
                            font-size:11px;
                            color:#96998f
                        ">
                            ${new Date(o.created_at)
                                .toLocaleTimeString('pt-BR', {
                                    hour: '2-digit',
                                    minute: '2-digit'
                                })}
                        </span>

                    </div>

                    <span class="status ${esc(o.status_pagamento)}">

                        ${payment}

                    </span>

                </div>

                ${(Array.isArray(o.itens) ? o.itens : [])
                .filter(i => i.status === 'cancelado' || !itensPagosCliente.has(i.id) || !['pronto', 'cancelado'].includes(i.status))
                .map(i => `

                    <div class="row order-item">

                        <div>

                            <strong class="${
                                i.status === 'cancelado'
                                ? 'cancelled' : ''
                            }">
                                ${esc(i.nome)}
                            </strong>

                            <br>

                            <span class="status ${esc(i.status)}">

                                ${esc(
                                    labels[i.status] ||
                                    'Indisponível'
                                )}

                            </span>

                        </div>

                        <div style="text-align:right">

                            ${money(
                                i.status === 'cancelado'
                                ? 0 : i.preco
                            )}

                            ${
                                i.status === 'pendente' &&
                                o.status_pagamento === 'aberto' &&
                                !itensPagosCliente.has(i.id) &&
                                i.id

                                ? `<button
                                    class="cancel-btn"
                                    data-order="${esc(o.id)}"
                                    data-item="${esc(i.id)}"
                                >Cancelar</button>`

                                : ''
                            }

                        </div>

                    </div>

                `).join('')}

                <div class="row order-total">

                    <span>Total do pedido</span>

                    <span>${money((Array.isArray(o.itens) ? o.itens : [])
                        .filter(i => i.status !== 'cancelado' && !itensPagosCliente.has(i.id))
                        .reduce((sum, i) => sum + Number(i.preco || 0), 0))}</span>

                </div>

            </article>

        `;

    }).join('') ||

    '<div class="empty">Você ainda não fez nenhum pedido nesta mesa.</div>';
}

/* CANCELAMENTO INDIVIDUAL */

async function cancelItem(button) {

    if (button.disabled) return;

    if (!confirm('Deseja cancelar este produto?')) {
        return;
    }

    button.disabled = true;

    try {

        const { error } = await sb.rpc(
            'gerenciar_item',
            {
                p_pedido_id: Number(button.dataset.order),
                p_item_id: button.dataset.item,
                p_novo_status: 'cancelado',
                p_motivo: null
            }
        );

        if (error) throw error;

        toast('Produto cancelado.');

    } catch (e) {

        toast(e.message || 'Não foi possível cancelar.');

    } finally {

        await loadOrders();

        button.disabled = false;
    }
}

/* EVENTOS DOS BOTÕES */

document.addEventListener('click', e => {

    const b = e.target.closest('button');

    if (!b) return;

    if (b.dataset.category) {

        activeCategory = b.dataset.category;

        document.querySelectorAll(
            '.category'
        ).forEach(el => {

            el.classList.toggle(
                'active',
                el.dataset.category === activeCategory
            );

        });

        renderProducts();
    }

    if (b.dataset.delta) {

        changeQty(
            b.dataset.id,
            Number(b.dataset.delta)
        );
    }

    if (b.dataset.item) {
        cancelItem(b);
    }
});

/* NAVEGAÇÃO INFERIOR */

function showTab(tab) {

    $('menuView').hidden = tab !== 'menu';

    $('ordersView').hidden = tab !== 'orders';

    $('menuTab').classList.toggle(
        'active', tab === 'menu'
    );

    $('ordersTab').classList.toggle(
        'active', tab === 'orders'
    );

    window.scrollTo({
        top: 0,
        behavior: 'smooth'
    });

    if (tab === 'orders') {
        loadOrders();
    }
}

$('menuTab').onclick = () => showTab('menu');

$('ordersTab').onclick = () => showTab('orders');

/* CARREGAR PRODUTOS */

async function loadProducts() {

    const { data, error } = await sb
        .from('produtos')
        .select('id,nome,categoria,descricao,preco,imagem')
        .eq('ativo', true)
        .order('id');

    if (error) throw error;

    products = data || [];

    for (const id of basket.keys()) {

        if (!products.some(p => String(p.id) === id)) {
            basket.delete(id);
        }
    }

    renderCategories();

    renderProducts();

    renderCart();
}

/* CARREGAR PEDIDOS */

async function loadOrders() {

    if (!uid) return;

    const n = ++seq;

    const { data, error } = await sb
        .from('pedidos')
        .select('*')
        .eq('usuario_id', uid)
        .eq('mesa', mesa)
        .in('status_pagamento', ['aberto', 'pago'])
        .order('created_at', { ascending: false });

    if (n !== seq) return;

    if (error) {

        toast('Não foi possível atualizar os pedidos.');
        return;
    }

    const { data: pagos, error: erroPagos } = await sb.rpc('meus_itens_pagos', {
        p_mesa: mesa
    });
    if (n !== seq) return;
    if (erroPagos) {
        toast('Não foi possível consultar os pagamentos.');
        return;
    }
    itensPagosCliente = new Set((pagos || []).map(i => i.item_id));
    orders = data || [];
    renderOrders();
}

/* INICIAR APLICAÇÃO */

async function start() {

    icons();

    try {

        if (!valid) {

            throw new Error(
                'Mesa inválida. Escaneie o QR Code correto.'
            );
        }

        const { data, error } =
            await sb.auth.getSession();

        if (error) throw error;

        let session = data.session;

        if (!session) {

            const result =
                await sb.auth.signInAnonymously();

            if (result.error) throw result.error;

            session = result.data.session;
        }

        if (!session?.user?.is_anonymous) {

            throw new Error('Sessão de cliente inválida.');
        }

        uid = session.user.id;

        await loadProducts();

        ready = true;

        renderCart();

        notice('');

        /* RECEBER ATUALIZAÇÕES EM TEMPO REAL */

        sb.channel('amora-cliente-' + uid)

            .on(
                'postgres_changes',
                {
                    event: '*',
                    schema: 'public',
                    table: 'pedidos',
                    filter: 'usuario_id=eq.' + uid
                },
                () => loadOrders()
            )

            .subscribe(status => {

                if (status === 'SUBSCRIBED') {
                    loadOrders();
                }
            });

        await loadOrders();

    } catch (e) {

        notice(
            'Não foi possível carregar o cardápio: ' +
            e.message
        );
    }
}

/* RECUPERAR CONEXÃO */

window.addEventListener('online', () => {

    if (uid) {

        loadOrders();

        loadProducts().catch(e => toast(e.message));
    }
});

document.addEventListener(
    'visibilitychange',
    () => {

        if (!document.hidden && uid) {
            loadOrders();
        }
    }
);

start();

</script>
